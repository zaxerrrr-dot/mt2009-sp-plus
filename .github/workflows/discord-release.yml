# Posts the CHANGELOG.md section of a new version to Discord, the way the
# upstream project's "GitHub Commits" bot does. Runs when a push to main
# changes VERSION to a version not posted before; can also be run by hand
# (Actions -> Discord - nowa wersja -> Run workflow) to post or repost one.
#
# Needs the repository secret DISCORD_WEBHOOK_URL (Settings -> Secrets and
# variables -> Actions): the webhook of the Discord channel.
name: Discord - nowa wersja

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja do opublikowania (puste = VERSION z main)"
        required: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Which version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "post=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new=$(tr -d ' \r\n' < VERSION)
          old=$(git show HEAD~1:VERSION 2>/dev/null | tr -d ' \r\n' || true)
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" != "$old" ]; then echo "post=1" >> "$GITHUB_OUTPUT"; else echo "post=0" >> "$GITHUB_OUTPUT"; fi
          echo "VERSION: $old -> $new"

      - name: Post to Discord
        if: steps.v.outputs.post == '1'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/scripts/discord_release.py "${{ steps.v.outputs.version }}"
