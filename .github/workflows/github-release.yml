# Creates a GitHub Release for every new version, the way the upstream
# project publishes its own (github.com/TieruYT/metin2-playerbots/releases):
# a tag, the CHANGELOG.md section as the notes, the update zip from
# releases/ attached, and GitHub's own "Source code" archives of the tree at
# that commit. Runs when a push to main changes VERSION (server, tag vX.Y.Z)
# or CLIENT_VERSION (client, tag klient-vX.Y.Z); can also be run by hand
# (Actions -> GitHub - wydanie -> Run workflow) for a version already on main.
#
# A server release is marked "latest": the Seban panel (7790) reads
# /releases/latest and expects a server version there, so a client release
# never takes that place. A release that already exists is left alone.
name: GitHub - wydanie

on:
  push:
    branches: [main]
    paths: [VERSION, CLIENT_VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja (puste = VERSION albo CLIENT_VERSION z main)"
        required: false
      kind:
        description: "Serwer czy klient"
        type: choice
        options: [serwer, klient]
        default: serwer

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Which versions
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.kind }}" = "klient" ]; then
              v="${{ github.event.inputs.version }}"; [ -n "$v" ] || v=$(tr -d ' \r\n' < CLIENT_VERSION)
              echo "client=$v" >> "$GITHUB_OUTPUT"
            else
              v="${{ github.event.inputs.version }}"; [ -n "$v" ] || v=$(tr -d ' \r\n' < VERSION)
              echo "server=$v" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          for f in VERSION CLIENT_VERSION; do
            new=$(tr -d ' \r\n' < "$f" 2>/dev/null || true)
            old=$(git show "HEAD~1:$f" 2>/dev/null | tr -d ' \r\n' || true)
            echo "$f: $old -> $new"
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              if [ "$f" = VERSION ]; then echo "server=$new" >> "$GITHUB_OUTPUT"; else echo "client=$new" >> "$GITHUB_OUTPUT"; fi
            fi
          done

      - name: Server release
        if: steps.v.outputs.server != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.server }}
        run: |
          tag="v$V"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already exists"; exit 0; fi
          python3 .github/scripts/github_release.py "$V" out
          zip="releases/metin2-server-update-$V.zip"
          files=(); [ -f "$zip" ] && files+=("$zip") || echo "::warning::$zip not in the repository; release without the zip"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "$(cat out/title.txt)" --notes-file out/notes.md --latest

      - name: Client release
        if: steps.v.outputs.client != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.client }}
        run: |
          tag="klient-v$V"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already exists"; exit 0; fi
          python3 .github/scripts/github_release.py "$V" out --client
          zip="releases/metin2-client-update-$V.zip"
          files=(); [ -f "$zip" ] && files+=("$zip") || echo "::warning::$zip not in the repository; release without the zip"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "$(cat out/title.txt)" --notes-file out/notes.md --latest=false
