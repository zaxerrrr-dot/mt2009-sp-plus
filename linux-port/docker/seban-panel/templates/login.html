<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ panel_brand }} · Seban Panel</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login login--seban"><form method="post" class="login-card"><img class="login-project-logo" src="{{ url_for('static', filename='branding/seban-webpanel-banner.png') }}" alt="Seban WEBPANEL · Playerbots Control Center"><div class="brand">{{ panel_brand }}<span>Seban Control Center</span></div><h1>Panel administracyjny</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for _, message in messages %}<div class="flash error">{{message}}</div>{% endfor %}{% endwith %}<label>Hasło administratora<input autofocus type="password" name="password" required></label><button>Zaloguj</button>{% if ui_languages and ui_languages|length > 1 %}<div class="sn-lang login-lang" translate="no"><span aria-hidden="true">🌐</span><select aria-label="Język / Language" onchange="if(this.value)location.href=this.value">{% for code, name in ui_languages %}<option value="{{ url_for('set_ui_language', code=code) }}"{% if code == ui_language %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></div>{% endif %}</form></body></html>
