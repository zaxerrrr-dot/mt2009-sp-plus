# Limits for the bridge location /to/. Generous on purpose: a home NAT, a school or
# Docker Desktop's gateway can put many players behind one address.
limit_conn_zone $binary_remote_addr zone=ywc_bridge_conn:10m;
limit_req_zone  $binary_remote_addr zone=ywc_bridge_req:10m rate=120r/m;
map $http_upgrade $ywc_connection_upgrade {
    default upgrade;
    ''      close;
}
