# The site lives in the volume /site (tools/sync-site.js). Only the precompressed .gz of
# a large file is there: gzip_static always sends it, gunzip unpacks it for a browser
# without gzip (client.data 105 -> 44 MB, corpus 3.9 -> 2.0 GB on the wire and on disk).
root /site;
absolute_redirect off;
charset utf-8;
gzip_static always;
gunzip on;
gzip on;
gzip_comp_level 5;
gzip_types application/javascript text/css application/json text/plain application/wasm;
gzip_vary on;

types {
    text/html                html;
    application/javascript   js;
    text/css                 css;
    application/json         json;
    text/plain               txt;
    application/wasm         wasm;
    application/octet-stream data bin;
    application/manifest+json webmanifest;
    image/png png;
}

set $ywc_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-src http: https:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

# The page - or, until the first download of the site has finished, a page that says so.
location = /client.html {
    if (!-f /site/.ywc/installed.json) {
        rewrite ^ /_ywc/wait.html last;
    }
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $ywc_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}

# Engine and startup data: the page asks for them with ?v=<build>, a new build is a new URL.
location ~ ^/(client\.(js|wasm|data)|boot\.js|preload\.js|yohara-mobile\.(js|css))$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/(sw\.js|version\.json)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~ "^/corpus/[0-9a-f]{32}\.bin$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/corpus/(manifest(-lite)?\.bin|order(-lite)?\.txt)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}

# The waiting page, its progress, and the health check of the container.
location = /_ywc/wait.html {
    gzip_static off;
    alias /opt/ywc/www/wait.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /_ywc/progress.json {
    gzip_static off;
    default_type application/json;
    alias /site/.ywc/progress.json;
    add_header Cache-Control "no-cache" always;
}
location = /_ywc/health {
    default_type text/plain;
    return 200 "ok\n";
}

location = / {
    # the server's default language (M2_DEFAULT_LANGUAGE, written by entrypoint.sh); deflang, so a
    # player's own saved choice still wins
    include /tmp/ywc-root.conf;
}
# the home-screen app (iPhone "Do ekranu poczatkowego", Android install): manifest and icons
location ~ ^/(manifest\.webmanifest|icon-(192|512)\.png|apple-touch-icon\.png)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location / {
    return 404;
}

# WebSocket -> TCP bridge (the bridge, 127.0.0.1 in this container). Host is passed as
# the browser sent it ($http_host, with the port): the bridge accepts a page of this
# very address (allowSameHostOrigin) and checks the target allowlist itself.
location ^~ /to/ {
    limit_conn ywc_bridge_conn 32;
    limit_req zone=ywc_bridge_req burst=40 nodelay;
    proxy_pass http://127.0.0.1:11497;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $ywc_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}
