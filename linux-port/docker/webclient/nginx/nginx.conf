# MT2009_PLUS_WEBCLIENT_SERVICE_V1: the web client's page and its WebSocket bridge, one
# container (entrypoint.sh starts both). Runs as the nginx user, listens on 8080; compose
# publishes it on M2_WEBCLIENT_PORT.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;
    access_log off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    include /etc/ywc/http.conf;
    server {
        listen 8080;
        server_name _;
        include /etc/ywc/site.conf;
    }
}
