# Rendered by linux-port-mt2009/port/composify.py from docker-compose.yml for
# the deployed tree, where this directory is linux-port/docker and the shared
# contexts sit beside it. DO NOT EDIT; edit docker-compose.yml and re-run.
# =============================================================================
#  Metin2 mt2009 (martysama0134 r41023) -- the server stack.
#
#      docker compose up -d
#
#  The same shape as linux-port/docker/docker-compose.yml: MariaDB, and every
#  game core in one supervised container. Same ports, same volume names, same
#  environment variables, so a .env written for the r40250 stack drives this
#  one unchanged. The panels, the ItemShop and the playerbot seed join as the
#  migration reaches them.
# =============================================================================

name: "${M2_COMPOSE_PROJECT_NAME:-metin2}"

services:

  mariadb:
    # 11.8 and not 10.11: the package's dumps were made by 11.8 and three of
    # their tables use utf8mb3_uca1400_ai_ci, a collation older servers refuse.
    image: mariadb:11.8
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-db"
    restart: unless-stopped
    stop_grace_period: 60s
    # No core files: a crashing mariadbd writing a multi-GB core under memory
    # pressure hung unkillable for hours and blocked shutdown (6 Nov 2026).
    ulimits:
      core: 0

    environment:
      MARIADB_ROOT_PASSWORD: "${M2_DB_ROOT_PASSWORD:?set M2_DB_ROOT_PASSWORD in .env}"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      M2_KEEP_DEMO_ACCOUNTS: "${M2_KEEP_DEMO_ACCOUNTS:-1}"
      TZ: "${M2_TZ:-UTC}"

    volumes:
      - db-data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
      # initdb runs gm_characters.sql from here, the same file apply.sh
      # runs on every start; one copy, two readers.
      - ./mariadb/playerbot:/opt/playerbot:ro

    ports:
      - "127.0.0.1:${M2_DB_PUBLISH_PORT:-3306}:3306"
    expose:
      - "3306"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

    networks: [backend]

  # ---------------------------------------------------------------------------
  # One-shot, additive Playerbot seed (rendered for this schema by
  # port/seedify.py; the migrator by port/migratorify.py). Runs on every start,
  # never rewrites an existing bot's progress.
  # ---------------------------------------------------------------------------
  playerbot-migrate:
    image: mariadb:11.8
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-playerbot-migrate"
    restart: "no"

    depends_on:
      mariadb:
        condition: service_healthy

    # Anchored: the game container runs this same migrator after the advanced
    # panel's whole-world reset (m2-world-reset), with the same settings.
    environment: &migrate-env
      M2_DB_HOST: mariadb
      M2_DB_PORT: "3306"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      M2_DB_ROOT_PASSWORD: "${M2_DB_ROOT_PASSWORD:-}"
      PLAYERBOT_SEED_STRICT: "${PLAYERBOT_SEED_STRICT:-0}"
      PLAYERBOT_EXPECT_MIN_EXISTING_BOTS: "${PLAYERBOT_EXPECT_MIN_EXISTING_BOTS:-0}"
      M2_PLAYERBOT_KINGDOMS: "${M2_PLAYERBOT_KINGDOMS:-1}"
      M2_PLAYERBOT_HUMAN_NAMES: "${M2_PLAYERBOT_HUMAN_NAMES:-1}"
      # The world's difficulty: apply.sh turns it into the event flags the
      # Biologist and the stable keeper read (quest/m2_difficulty.lua).
      M2_DIFFICULTY: "${M2_DIFFICULTY:-easy}"
      M2_BIOLOGIST_WAIT_HOURS: "${M2_BIOLOGIST_WAIT_HOURS:-0}"
      M2_HORSE_WAIT_HOURS: "${M2_HORSE_WAIT_HOURS:-0}"
      # The waits between two skill books, players' and bots' (custom only;
      # the presets carry their own).
      M2_BOOK_WAIT_HOURS: "${M2_BOOK_WAIT_HOURS:-0}"
      M2_BOT_BOOK_WAIT_HOURS: "${M2_BOT_BOOK_WAIT_HOURS:-0}"
      # The NPC exchanges' chances for a custom difficulty, percent (0 = the
      # package's 100/100/55; the presets carry their own).
      M2_EXCHANGE_DUST_CHANCE: "${M2_EXCHANGE_DUST_CHANCE:-0}"
      M2_EXCHANGE_PARCHMENT_CHANCE: "${M2_EXCHANGE_PARCHMENT_CHANCE:-0}"
      M2_EXCHANGE_MATERIAL_CHANCE: "${M2_EXCHANGE_MATERIAL_CHANCE:-0}"
      # The rates a fresh world starts on, as event flags written before
      # the cores come up (apply.sh). A world that has been set from the
      # panel keeps what the panel said; these reach only a world whose
      # flags do not exist yet.
      M2_RATE_EXP: "${M2_RATE_EXP:-100}"
      M2_RATE_DROP: "${M2_RATE_DROP:-100}"
      M2_RATE_YANG: "${M2_RATE_YANG:-100}"
      M2_PLAYERBOT_START_HELD: "${M2_PLAYERBOT_START_HELD:-0}"
      # Whether the world gives the apprentice chest, to a player's new
      # character and to the bots alike (the launcher's difficulty window and
      # new-world dialog; the migrator writes the flag the quest, the seed and
      # the cores read). M2_PLAYERBOT_DISABLE_STUDENT_CHEST=1 is Seban's own
      # integration's name for off, and is read as that.
      M2_STARTER_CHEST: "${M2_STARTER_CHEST:-1}"
      # The starter kit of a new character and of the bots the seed makes:
      # default, medium (+5 weapon and armour) or easy (+9 set) - the
      # launcher's new-world window; the migrator writes m2_starter_kit.
      M2_STARTER_KIT: "${M2_STARTER_KIT:-default}"
      # The world's switches for the Cor Draconis and the sashes (apply.sh
      # writes m2_alchemy_off / m2_sash_off when .env changed).
      M2_ALCHEMY: "${M2_ALCHEMY:-1}"
      M2_SASHES: "${M2_SASHES:-1}"
      M2_PLAYERBOT_DISABLE_STUDENT_CHEST: "${M2_PLAYERBOT_DISABLE_STUDENT_CHEST:-0}"
      # Whether the world is played with Auto Lowy and with the companion
      # (the launcher's difficulty window; the migrator writes the flags).
      M2_AUTOHUNT: "${M2_AUTOHUNT:-1}"
      # MT2009_PLUS_SIDEKICK_OFF_V1 (Yohara 3.0, the owner, 21 October 2026): the
      # companion is off unless .env says 1 - it is not developed any further and
      # may not work correctly; Buffi (M2_BUFFI) took its key and its button.
      M2_SIDEKICK: "${M2_SIDEKICK:-0}"
      # MT2009_PLUS_BUFFI_V1: Buffi, Ameria's support shaman (playerbot_buffi.cpp):
      # 1 on, 0 off. The game core reads it at start, the migrator writes
      # m2_buffi_off for the quests; seals, names and skills stay when off.
      M2_BUFFI: "${M2_BUFFI:-1}"
      # MT2009_PLUS_MLODZI_BOHATEROWIE_V1: Bronie dla Mlodych Bohaterow (the letter at
      # level 1, 10 ... 70, one weapon of the tier, 15 days): 1 on, 0 off (apply.sh
      # writes m2_mlodzi_off for the quest and the cores; given weapons keep their days).
      M2_MLODZI_BOHATEROWIE: "${M2_MLODZI_BOHATEROWIE:-1}"
      # Auto Lowy only with the ItemShop's ticket (1) or for everybody (0).
      M2_AUTOHUNT_ITEM: "${M2_AUTOHUNT_ITEM:-0}"
      # The Dom Towarowy at the miscellaneous merchant in M1 (the launcher's
      # difficulty window; the migrator writes m2_flea_market_off).
      M2_FLEA_MARKET: "${M2_FLEA_MARKET:-1}"
      # The Arezzo module (maps 360-366, their dungeons and guards, the Arezzo costume sets
      # in the ItemShops): 1 on, 0 off
      # (apply.sh writes mt2009_arezzo_closed when .env changed; the panel switches it live).
      M2_AREZZO: "${M2_AREZZO:-0}"
      # Seon-Hae's 6th/7th bonus at NPC 20095: 1 on (the default), 0 off (apply.sh
      # writes m2_seonhae_on when .env changed; the panel switches it live).
      M2_SEONHAE: "${M2_SEONHAE:-1}"
      # The teleport map under TAB (MT2009_PLUS_TELEPORT_MAP_V1, Autor: Mur4s): 1 on,
      # 0 off (apply.sh writes m2_teleport_map_on when .env changed; the panels switch it live).
      M2_TELEPORT_MAP: "${M2_TELEPORT_MAP:-0}"
      # The players' offline shops as big as the bots' (MT2009_PLUS_SHOP_QOL_V2):
      # 1 on, 0 off (apply.sh writes m2_shop_big_on when .env changed; both panels switch it live).
      M2_SHOP_BIG: "${M2_SHOP_BIG:-0}"
      # MT2009_PLUS_SKILL_HACK_V1: the other specialisation's skills beside the main path
      # (server-patches/skillhack): 1 on, 0 off (default). apply.sh writes the event flag
      # m2_skill_hack when .env changed; GMs (/e m2_skill_hack) and the panel switch it live.
      M2_SKILL_HACK: "${M2_SKILL_HACK:-0}"
      # Karty Potworow, the Monster Card System (MT2009_PLUS_MONSTER_CARDS_V1,
      # Autor: Digi Rasta): 1 on, 0 off. The game core reads it at start
      # (playerbot_monster_card.h) - off, the cards do nothing and the set
      # bonuses come off at the next login; MT2009 Classic sets 0.
      M2_MONSTER_CARDS: "${M2_MONSTER_CARDS:-1}"
      # The health of monsters, bosses and Metin stones: default (100%), easy
      # (80%) or a percent 10-300 (the launcher's difficulty window; the
      # migrator writes m2_mob_hp when .env changed, the panel's card live).
      M2_MONSTER_HP: "${M2_MONSTER_HP:-default}"
      # How hard monsters hit: default (100%), easy (80%) or a percent 10-300
      # (MT2009_PLUS_MOB_ATTACK_V1; the migrator writes m2_mob_attack when .env
      # changed, the advanced panel's "Konfiguracja serwera" live).
      M2_MONSTER_ATTACK: "${M2_MONSTER_ATTACK:-default}"
      # How hard the players hit monsters, bosses and Metins: default (100%) or a
      # percent 10-300, never PvP (MT2009_PLUS_PC_ATTACK_V1, the EMERALD configuration's
      # +10%; the migrator writes m2_pc_attack when .env changed, the advanced panel live).
      M2_PLAYER_ATTACK: "${M2_PLAYER_ATTACK:-default}"
      # The item bonuses and the monsters' elements: mt2009 (the default, as it was) or global (the global
      # server's bonus table and every monster's element, MT2009_PLUS_GLOBAL_BONUS_V1). The migrator switches
      # world.item_attr and the elements and writes m2_bonus_global for the cores (apply.sh).
      M2_BONUS_MODE: "${M2_BONUS_MODE:-global}"

    entrypoint: ["/bin/sh", "/opt/playerbot/apply.sh"]

    volumes:
      - ./mariadb/playerbot:/opt/playerbot:ro
      # The spool, for one file: whether a world about to be made keeps its
      # bots at the door until the operator lets them in. The migrator is the
      # only step that runs before the cores and knows the world is fresh.
      - rates-spool:/opt/m2spool

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks: [backend]

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${M2_BASE_IMAGE:-ubuntu:24.04}"
        MAKE_JOBS: "${M2_MAKE_JOBS:-}"
        STRIP_BINARIES: "${M2_STRIP_BINARIES:-1}"
        # The apt mirror the image build installs from. Gdansk by default: on
        # 11 September 2026 archive.ubuntu.com served Polish players at a few
        # kilobytes a second and every first build "hung" at deps 7/7 for
        # twenty minutes; the mirror cut it to two. An empty M2_APT_MIRROR in
        # .env takes this default too, so an install made before it needs no
        # edit. Set M2_APT_MIRROR to another mirror for another country.
        APT_MIRROR: "${M2_APT_MIRROR:-http://ubuntu.task.gda.pl/ubuntu/}"
    # MT2009_PLUS_YOHARA_IMAGES_V1 (the owner's fix in the 3.0.0-test package, 21 Oct 2026): every Yohara installation
    # gets its own images. The 2.x package uses metin2/game:mt2009; sharing that tag made a fresh Yohara world
    # start the already-built 2.x engine without compiling this package. The tag stays 3.0.0-test (the owner, 21 Oct:
    # a Yohara update reuses the Yohara images; the launcher's rebuild marker rebuilds them under the same names).
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-game:3.0.0-test"
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-game"
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    # MT2009_PLUS_EPHEMERAL_PORTS_V1 (the owner's list of 3 November 2026: "Rzadki blad przy starcie serwera: jeden z
    # kanalow startuje bez map Yohary"; his own server's fix of 2 November): the cores' own outgoing connections (P2P,
    # to the DB core) take their source ports from the ephemeral range, by default 32768-60999. A stack whose game
    # ports sit in it (M2_GAME_PORT_BASE 38000 on his server: ch1-first's P2P connection to ch1-game2 got source port
    # 38004 before ch2-game3, CH2's Yohara core at BASE+4, bound it - "socket_bind: Address already in use", CH2 ran
    # without its Yohara maps) lost a core at random. The range starts above every listening port of the container
    # (game BASE..BASE+40, P2P 14xxx, auth 11000, the DB core); 49152-60999 (the IANA dynamic range) keeps clear of a
    # base up to 49100 (38000 and 43000 on the owner's VPSes). A stack with its base higher sets M2_EPHEMERAL_PORT_RANGE
    # in .env ("<low> <high>", above BASE+40).
    sysctls:
      net.ipv4.ip_local_port_range: "${M2_EPHEMERAL_PORT_RANGE:-49152 60999}"

    depends_on:
      mariadb:
        condition: service_healthy
      playerbot-migrate:
        condition: service_completed_successfully

    environment:
      # The migrator's settings too, for the whole-world reset of the advanced
      # panel (m2-world-reset runs apply.sh from here); the keys below win.
      <<: *migrate-env
      M2_DB_HOST: mariadb
      M2_DB_PORT: "3306"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      M2_PUBLIC_ADDRESS: "${M2_PUBLIC_ADDRESS:-}"
      M2_BIND_IP: "${M2_BIND_IP:-0.0.0.0}"
      M2_CHANNELS: "${M2_CHANNELS:-1}"
      M2_MAX_LEVEL: "${M2_MAX_LEVEL:-120}"
      M2_TEST_SERVER: "${M2_TEST_SERVER:-0}"
      M2_MALL_URL: "${M2_MALL_URL:-${M2_PUBLIC_ADDRESS:-127.0.0.1}:${M2_ITEMSHOP_PUBLIC_PORT:-7791}}"
      # MT2009_PLUS_SHOP3_TOKEN_V1: the key of the ItemShop's in-game login token (the itemshop service reads the
      # same); empty = derived from M2_DB_PASSWORD, which both services have.
      M2_SHOP3_TOKEN_SECRET: "${M2_SHOP3_TOKEN_SECRET:-}"
      # Where a GM's "Podglad" (the player window's preview) opens <url>players/<pid>:
      # the classic panel's character card, which the package pointed at its
      # author's own panel.mt2009.pl (playerbotify.py, apply_gm_panel_url).
      M2_GM_PANEL_URL: "${M2_GM_PANEL_URL:-http://127.0.0.1:${M2_PANEL_PUBLIC_PORT:-7788}/}"
      M2_LOG_KEEP_DAYS: "${M2_LOG_KEEP_DAYS:-2}"
      M2_LOG_KEEP_HOURS: "${M2_LOG_KEEP_HOURS:-48}"
      M2_TABLE_POSTFIX: "${M2_TABLE_POSTFIX:-}"
      M2_ADMINPAGE_PASSWORD: "${M2_ADMINPAGE_PASSWORD:-}"
      M2_CORE_DUMPS: "${M2_CORE_DUMPS:-0}"
      PLAYERBOT_AUTOSPAWN_COUNT: "${PLAYERBOT_AUTOSPAWN_COUNT:-350}"
      PLAYERBOT_MEDAL_DROPPERS: "${PLAYERBOT_MEDAL_DROPPERS:-0}"
      PLAYERBOT_MEDAL_DROPPER_LEVEL: "${PLAYERBOT_MEDAL_DROPPER_LEVEL:-25}"
      PLAYERBOT_RETIRE_COUNT: "${PLAYERBOT_RETIRE_COUNT:-0}"
      PLAYERBOT_RETIRE_BATCH_ID: "${PLAYERBOT_RETIRE_BATCH_ID:-0}"
      PLAYERBOT_RETIRE_WINDOW_MINUTES: "${PLAYERBOT_RETIRE_WINDOW_MINUTES:-1440}"
      PLAYERBOT_RETIRE_SHOP_MINUTES: "${PLAYERBOT_RETIRE_SHOP_MINUTES:-60}"
      # The spawn plan (input_db.cpp): the cohort's window in minutes, and a
      # second cohort joining one at a time over hours.
      PLAYERBOT_SPAWN_WINDOW_MINUTES: "${PLAYERBOT_SPAWN_WINDOW_MINUTES:-1}"
      PLAYERBOT_LATE_JOINERS: "${PLAYERBOT_LATE_JOINERS:-0}"
      PLAYERBOT_LATE_JOIN_HOURS: "${PLAYERBOT_LATE_JOIN_HOURS:-24}"
      # The operator's own number per kingdom instead of a share of
      # PLAYERBOT_AUTOSPAWN_COUNT (the launcher's "Indywidualne wartosci dla
      # krolestw"); read by the bootstrap in input_db.cpp.
      PLAYERBOT_AUTOSPAWN_PER_KINGDOM: "${PLAYERBOT_AUTOSPAWN_PER_KINGDOM:-0}"
      PLAYERBOT_AUTOSPAWN_SHINSOO: "${PLAYERBOT_AUTOSPAWN_SHINSOO:-0}"
      PLAYERBOT_AUTOSPAWN_CHUNJO: "${PLAYERBOT_AUTOSPAWN_CHUNJO:-0}"
      PLAYERBOT_AUTOSPAWN_JINNO: "${PLAYERBOT_AUTOSPAWN_JINNO:-0}"
      # The second channel: the entrypoint decides it once for every core,
      # from here or from the web panel's wish (whichever is newer), raises
      # M2_CHANNELS to 2 and puts PLAYERBOT_CH2_SHARE percent of the bots on
      # it; shops stay on the first. The range tells it whether players can
      # reach the second channel's ports.
      M2_PLAYERBOT_CH2: "${M2_PLAYERBOT_CH2:-0}"
      PLAYERBOT_CH2_SHARE: "${PLAYERBOT_CH2_SHARE:-40}"
      # MT2009_PLUS_BOT_YOHARA_HANDOVER_V1: the bots between the game cores of a channel
      # (playerbot_yohara_bots.h) - Zaklety Las 97-109, the Time Rift (SZC) 110-119, the loot
      # runs on the 90-level maps; the limits are per channel.
      PLAYERBOT_HANDOVER: "${PLAYERBOT_HANDOVER:-1}"
      PLAYERBOT_HANDOVER_CHANNELS: "${PLAYERBOT_HANDOVER_CHANNELS:-1}"
      # MT2009_PLUS_BOT_LOAD_PLACE_V1: a bot saved on a map its core lacks is placed before the
      # engine's check (handover spot / village) - CPlayerBotManager::PlaceLoadingBot.
      PLAYERBOT_LOAD_PLACE: "${PLAYERBOT_LOAD_PLACE:-1}"
      # MT2009_PLUS_PVPFAN_V1: "PVP Fan" - the Seban panel's bot wars (/pvpfan, playerbot_pvpfan.h): 1 on (the
      # default), 0 off; the caps of one war and of all wars of a core, and the logins a second at a start.
      M2_PVPFAN: "${M2_PVPFAN:-1}"
      M2_PVPFAN_MAX_CATEGORY: "${M2_PVPFAN_MAX_CATEGORY:-500}"
      M2_PVPFAN_MAX_TOTAL: "${M2_PVPFAN_MAX_TOTAL:-1000}"
      M2_PVPFAN_SPAWN_PER_SEC: "${M2_PVPFAN_SPAWN_PER_SEC:-20}"
      PLAYERBOT_ZAKLETY_MAX: "${PLAYERBOT_ZAKLETY_MAX:-100}"
      PLAYERBOT_ZAKLETY_MIN_LEVEL: "${PLAYERBOT_ZAKLETY_MIN_LEVEL:-100}"
      PLAYERBOT_ZAKLETY_MIN_HP: "${PLAYERBOT_ZAKLETY_MIN_HP:-20000}"
      PLAYERBOT_ZAKLETY_STAY_MIN: "${PLAYERBOT_ZAKLETY_STAY_MIN:-120}"
      PLAYERBOT_SZC_MAX: "${PLAYERBOT_SZC_MAX:-100}"
      PLAYERBOT_SZC_PARTIES: "${PLAYERBOT_SZC_PARTIES:-14}"
      PLAYERBOT_LOOTRUN_MAX: "${PLAYERBOT_LOOTRUN_MAX:-6}"
      PLAYERBOT_LOOTRUN_MAPS: "${PLAYERBOT_LOOTRUN_MAPS:-303,304}"
      # MT2009_PLUS_BOT_YOHARA_COHORT_V1: Wezowe Pole (80) / Kraina Gigantow (70) on game2 through
      # the handover, and the night's cohorts (common.playerbot_yohara_cohort, tools/yohara_bot_cohort.py).
      # The limits above for the night of 21/22 October: Zaklety 100, SZC 100 (14 parties at once).
      PLAYERBOT_SNAKEFIELD_MAX: "${PLAYERBOT_SNAKEFIELD_MAX:--1}"  # MT2009_PLUS_MAPS_WZ_NOCAP_V1: -1 no limit, 0 off
      PLAYERBOT_GIANTLAND_MAX: "${PLAYERBOT_GIANTLAND_MAX:--1}"
      PLAYERBOT_WZ_STAY_MIN: "${PLAYERBOT_WZ_STAY_MIN:-120}"
      PLAYERBOT_COHORT: "${PLAYERBOT_COHORT:-1}"
      PLAYERBOT_COHORT_EXCLUSIVE: "${PLAYERBOT_COHORT_EXCLUSIVE:-1}"
      PLAYERBOT_COHORT_STAY_MIN: "${PLAYERBOT_COHORT_STAY_MIN:-720}"
      PLAYERBOT_COHORT_DISPATCH: "${PLAYERBOT_COHORT_DISPATCH:-6}"
      PLAYERBOT_COHORT_REST_MIN: "${PLAYERBOT_COHORT_REST_MIN:-10}"
      PLAYERBOT_COHORT_DEATH_REST_MIN: "${PLAYERBOT_COHORT_DEATH_REST_MIN:-60}"
      # MT2009_PLUS_BOT_HYDRA_COHORT_V1: the Hydra (Obrona Statku) - bots on the pier of the port (368) a channel,
      # and the parties on a ship at once (tools/yohara_bot_cohort.py --hydra 32: four fixed parties of eight).
      # MT2009_PLUS_BOT_HYDRA_PAIRS_V1: --hydra-pairs 16 - sixteen pairs (a Ninja and another class), all at once.
      PLAYERBOT_HYDRA_MAX: "${PLAYERBOT_HYDRA_MAX:-32}"
      PLAYERBOT_HYDRA_PARTIES: "${PLAYERBOT_HYDRA_PARTIES:-16}"
      # MT2009_PLUS_BOT_YOHARA_MAPS_V1: the Sung Ma maps of Yohara for the bot Champions (playerbot_yohara_sungma.h) - a
      # channel's limit, a map's, the stay (min), the maps switched on (374,373,376,377,385,388,389,393,394).
      PLAYERBOT_SUNGMA_MAX: "${PLAYERBOT_SUNGMA_MAX:-120}"
      PLAYERBOT_SUNGMA_MAP_MAX: "${PLAYERBOT_SUNGMA_MAP_MAX:-30}"
      PLAYERBOT_SUNGMA_STAY_MIN: "${PLAYERBOT_SUNGMA_STAY_MIN:-240}"
      PLAYERBOT_SUNGMA_MAPS: "${PLAYERBOT_SUNGMA_MAPS:-374,373,376,377,385,388,389,393,394}"
      # MT2009_PLUS_BOT_YOHARA_TRADE_TRIP_V1: the channel's Sung Ma bots home to trade at once (0: no trade trips).
      PLAYERBOT_SUNGMA_TRADE_MAX: "${PLAYERBOT_SUNGMA_TRADE_MAX:-6}"
      # MT2009_PLUS_BOT_DGRUN_CAP_ENV_V1: the bots' dungeon runs at once per core (GetPlayerBotDgRunCap): one a
      # BOTS_PER_RUN bots, at least MIN_RUNS, at most MAX_RUNS (0 = no top); a starved dungeon STARVED_OVER_CAP above.
      PLAYERBOT_DGRUN_MIN_RUNS: "${PLAYERBOT_DGRUN_MIN_RUNS:-4}"
      PLAYERBOT_DGRUN_MAX_RUNS: "${PLAYERBOT_DGRUN_MAX_RUNS:-12}"
      PLAYERBOT_DGRUN_BOTS_PER_RUN: "${PLAYERBOT_DGRUN_BOTS_PER_RUN:-120}"
      PLAYERBOT_DGRUN_STARVED_OVER_CAP: "${PLAYERBOT_DGRUN_STARVED_OVER_CAP:-2}"
      M2_PLAYERBOT_CH2_SET_AT: "${M2_PLAYERBOT_CH2_SET_AT:-0}"
      # MT2009_PLUS_CH34_V1: the third and fourth channel on the same principle
      # (bots relog to CH1 for the stalls), off by default; CH3 only with CH2,
      # CH4 only with CH3. Each is three more cores (~2.5-3 GB RAM). The range
      # above/below has to reach base+22 (CH3) or base+32 (CH4).
      M2_PLAYERBOT_CH3: "${M2_PLAYERBOT_CH3:-0}"
      M2_PLAYERBOT_CH4: "${M2_PLAYERBOT_CH4:-0}"
      M2_GAME_CONTAINER_PORT_RANGE: "${M2_GAME_CONTAINER_PORT_RANGE:-13000-13003}"
      # The channels' first port inside the container (m2-render-config); the
      # range above has to start there. 13000 unless a second stack on the same
      # host needs another one.
      M2_GAME_PORT_BASE: "${M2_GAME_PORT_BASE:-13000}"
      # m2-render-config writes these into CONFIG. Without a line here the
      # value in .env never reaches the container and the defaults stand, which
      # is what every 2.x world had until 2.0.52 (the 1.x compose passes them).
      M2_MOONLIGHT_CHEST_PERMILLE: "${M2_MOONLIGHT_CHEST_PERMILLE:-10}"
      M2_MOONLIGHT_CHEST_STONE_PERMILLE: "${M2_MOONLIGHT_CHEST_STONE_PERMILLE:-300}"
      M2_DRAGON_COIN_STONE_PERMILLE: "${M2_DRAGON_COIN_STONE_PERMILLE:-3}"
      M2_DRAGON_COIN_BOSS_PERMILLE: "${M2_DRAGON_COIN_BOSS_PERMILLE:-50}"
      # A Blessing Scroll from a Metin stone of level 15-99, in thousandths.
      M2_BLESSING_SCROLL_STONE_PERMILLE: "${M2_BLESSING_SCROLL_STONE_PERMILLE:-10}"
      # 0 keeps Shinsoo and Jinno from being started even when the seed once
      # registered them (the migrate service reads the same switch for the
      # seed itself).
      M2_PLAYERBOT_KINGDOMS: "${M2_PLAYERBOT_KINGDOMS:-1}"
      # split (default): per-kingdom cores; Shinsoo/Jinno cap ~36 because the
      # shared frontier lives only on game1. unified: all three kingdoms and the
      # frontier on game1, so every bot reaches 1..104 (m2-render-config reads
      # this). One core carries every bot then - keep the population modest.
      M2_PLAYERBOT_WORLD_LAYOUT: "${M2_PLAYERBOT_WORLD_LAYOUT:-unified}"
      # MT2009_PLUS_SPIDER3_SWITCH_V1: 3 Loch Pajakow (217) - 1 only together with the client that has its map
      # (m2-render-config: game1 hosts it, V2's warp 10098 opens). 1 (default, Yohara client 3.0.3 has it); 0: unreachable.
      M2_SPIDER3_ON: "${M2_SPIDER3_ON:-1}"
      # MT2009_PLUS_BALATHOR_SWITCH_V1: Krypta Balathora (420) - 1 only together with the client that has its map
      # (m2-render-config: game1 hosts it, Dolnarr offers the lair). 1 (default, Yohara client 3.0.3 has it); 0: shut.
      M2_BALATHOR_ON: "${M2_BALATHOR_ON:-1}"
      # Only said in the start log here; the migrate service is what acts on it.
      M2_DIFFICULTY: "${M2_DIFFICULTY:-easy}"
      # MT2009_PLUS_LANGUAGE_DEFAULT_V1: the server's default language (pl en de tr ro es it fr pt cz hu gr ae) - every
      # player who never chose one in the client's settings, the bots' shout and trade chat (mt2009_language.cpp).
      M2_DEFAULT_LANGUAGE: "${M2_DEFAULT_LANGUAGE:-pl}"
      TZ: "${M2_TZ:-UTC}"

    ports:
      - "${M2_HOST_BIND_ADDRESS:-0.0.0.0}:${M2_AUTH_PORT:-11000}:11000/tcp"
      # The container side is a variable too: the launcher widens both to
      # 13000-13012 when it switches the second channel on (M2_PLAYERBOT_CH2),
      # 13000-13022 with CH3 and 13000-13032 with CH4 (MT2009_PLUS_CH34_V1),
      # and a world without it publishes the first channel's three as before.
      # MT2009_PLUS_YOHARA_CORE_V1: plus the Yohara core of each channel, which
      # listens in the gap (13003 for CH1, 13004-13006 for CH2-CH4) - one
      # channel publishes 13000-13003, two and more need no more than before.
      - "${M2_HOST_BIND_ADDRESS:-0.0.0.0}:${M2_GAME_PORT_RANGE:-13000-13003}:${M2_GAME_CONTAINER_PORT_RANGE:-13000-13003}/tcp"
      # never published: 12000, 14000-14002 (p2p), 15000 (the db core).

    volumes:
      - game-var:/opt/metin2/var
      - rates-spool:/opt/m2spool
      # The advanced panel's resets (m2-world-reset): the dumps and the
      # migrator a fresh database is made from, and the server folder's
      # backups directory for the copy taken before a reset.
      - ./mariadb/initdb.d:/opt/m2initdb:ro
      - ./mariadb/playerbot:/opt/playerbot:ro
      - "${M2_BACKUP_HOST_DIR:-../../backups}:/opt/m2backups"

    ulimits:
      nofile:
        soft: 16384
        hard: 16384

    networks: [backend]

  # ==== services shared with linux-port (rendered by port/composify.py) ====
  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-panel:3.0.0-test"
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-panel"
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy
      playerbot-migrate:
        condition: service_completed_successfully

    environment:
      M2_DB_HOST: mariadb
      M2_DB_PORT: "3306"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"

      # Blank on first run means "generate one and print it once".
      M2_PANEL_PASSWORD: "${M2_PANEL_PASSWORD:-}"
      M2_PANEL_PORT: "7788"
      M2PANEL_ENGINE: mt2009
      # The address the panel is published on, and the explicit answer to
      # "may anybody else reach it": empty lets the panel decide from the
      # address (loopback = local, no passphrase), 0 or 1 overrides that.
      M2PANEL_BIND_ADDRESS: "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}"
      M2PANEL_LOCAL_ONLY: "${M2_PANEL_LOCAL_ONLY:-}"
      M2_PANEL_BIND: "0.0.0.0"

      # So the panel can answer "is the game up" by probing the game container
      # rather than by reading its own socket table, which in a container shows
      # nothing about the game at all.
      M2_GAME_HOST: game
      M2_PANEL_STATUS_PORTS: "${M2_PANEL_STATUS_PORTS:-11000,13000}"

      M2_BRAND: "${M2_BRAND:-}"
      M2_CLIENT_NAME: "${M2_CLIENT_NAME:-}"
      M2_CLIENT_URL: "${M2_CLIENT_URL:-}"
      # MT2009_PLUS_LANGUAGE_DEFAULT_V1: the pages' language for a visitor who has not picked one (m2lang cookie).
      M2_DEFAULT_LANGUAGE: "${M2_DEFAULT_LANGUAGE:-pl}"
      # 180, not 45: r40250 gives a character four inventory pages. At 45 the
      # panel only looks at the first page and refuses to give an item to
      # anyone whose first page is full.
      M2_INVENTORY_SLOTS: "${M2_INVENTORY_SLOTS:-180}"
      # player.item.count is TINYINT UNSIGNED. Without this the panel allows
      # 65535 and MySQL truncates in silence -- 1000 potions become 255.
      M2_MAX_ITEM_COUNT: "${M2_MAX_ITEM_COUNT:-255}"
      # The same MAX_LEVEL the game core is given, so the panel offers what the
      # server will actually accept. It matters because the server does not say
      # no: a level above gPlayerMaxLevel makes PointChange return without a
      # word, and everything upstream reports success. Passed as M2PANEL_* on
      # purpose -- the panel reads the environment before its config file, so
      # this reaches an install whose m2panel.conf was written long ago.
      M2PANEL_MAX_LEVEL: "${M2_MAX_LEVEL:-120}"
      # 1 when this server is reachable only from the machine it runs on -- the
      # Windows installer sets it, and so does install.sh --local. The panel
      # then tells the operator that nobody else can join, instead of telling
      # them to hand the address out. It cannot be inferred from the bind
      # address: a public server behind nginx also binds the panel to 127.0.0.1.
      M2_LOCAL_ONLY: "${M2_LOCAL_ONLY:-0}"
      # Where players write when something needs adjusting. Empty means the
      # front page leaves the line out entirely -- better than pointing your
      # players at whatever address happened to be in the source.
      M2_CONTACT_EMAIL: "${M2_CONTACT_EMAIL:-}"
      # The supporters' password for /register. Empty = registration as before.
      M2PANEL_REGISTER_ACCESS_CODE: "${M2_REGISTER_ACCESS_CODE:-}"
      # What the supporters' sign-up page tells players to add in the launcher:
      # the server address and the login / first channel port.
      M2PANEL_REGISTER_GAME_ADDRESS: "${M2_REGISTER_GAME_ADDRESS:-}"
      M2PANEL_GAME_ADDRESS: "${M2_CLIENT_ADDRESS:-${M2_PUBLIC_ADDRESS:-}}"
      M2PANEL_LOGIN_PORT: "${M2_CLIENT_AUTH_PORT:-${M2_AUTH_PORT:-11000}}"
      M2PANEL_GAME_PORT_RANGE: "${M2_GAME_PORT_RANGE:-13000-13003}"

      # ---- the client that runs in a browser ------------------------------
      # Off. With it off the panel offers nothing, serves nothing under /play
      # and never contacts the bridge, which is what a server without a browser
      # client wants. Even set to 1 the button appears only once a browser
      # client has actually been placed on the panel's data volume, because
      # until then there would be nothing behind it.
      M2PANEL_BROWSER_PLAY: "${M2_BROWSER_PLAY:-0}"
      # Where the built browser client is, on the panel's own volume.
      M2PANEL_BROWSER_DIR: "/usr/local/m2panel/browser"
      # The bridge's own port on the host, for the case where there is no proxy
      # in front: the panel then tells the page to dial this machine there.
      # Behind nginx the page is told the panel's own address and port instead,
      # because nginx routes /to/ and /ping through -- the client cannot be
      # given a path, only host:port, so same-origin is the only way it gets a
      # certificate. See admin_panel.py, bridge_endpoint().
      M2PANEL_BRIDGE_PORT: "${M2_BRIDGE_PORT:-7789}"
      # Where the panel itself asks the bridge which ports it will connect to,
      # over this network. Not what the browser is told -- see above.
      M2PANEL_BRIDGE_HOST: "wsbridge"
      # Whether nginx is in front, which the panel cannot find out for itself:
      # Docker's port forwarder rewrites the source address, so a proxied
      # request does not arrive from the loopback address it was sent to. The
      # installer sets this when it configures nginx -- and in that arrangement
      # it publishes the panel's port on 127.0.0.1 alone, so the X-Forwarded-*
      # headers this makes the panel believe cannot reach it from anywhere
      # else. Without a domain there is no nginx and this stays 0.
      M2PANEL_TRUST_PROXY: "${M2_TRUST_PROXY:-0}"
      # How much game data the page keeps in memory, in MB. The thing that
      # decides whether the game stutters -- see admin_panel.py, where the
      # number is explained. 0 leaves the page's own default (96) alone.
      M2PANEL_BROWSER_CACHE_MB: "${M2_BROWSER_CACHE_MB:-768}"
      # MT2009_PLUS_WEBCLIENT_SERVICE_V1: the browser game of the webclient service
      # below - "Graj w przeglądarce" links to http://<this server>:<port>/ (or
      # M2_WEBCLIENT_PUBLIC_URL) when it is on.
      M2PANEL_WEBCLIENT_ON: "${M2_WEBCLIENT_ON:-1}"
      M2PANEL_WEBCLIENT_PORT: "${M2_WEBCLIENT_PORT:-7792}"
      M2PANEL_WEBCLIENT_URL: "${M2_WEBCLIENT_PUBLIC_URL:-}"

      # Server rates. The panel runs M2PANEL_RATES_SCRIPT when somebody saves
      # the rates page and reads M2PANEL_RATES_STATUS back to report how it
      # went -- the same two settings it uses on FreeBSD, pointed at the
      # container versions. The script here only writes a request into the
      # spool the game container is watching; see panel/bin/apply_rates.sh.
      #
      # The script deliberately does NOT live on the panel-data volume: an
      # existing stack keeps its volume across an upgrade, so a file shipped
      # there in a new image would never appear.
      M2PANEL_RATES_SCRIPT: "/usr/local/bin/apply_rates.sh"
      M2PANEL_RATES_STATUS: "/opt/m2spool/rates.status"
      M2PANEL_RATES_SPOOL: "/opt/m2spool"

      # Game master ranks travel over the same spool: the panel writes the row
      # into common.gmlist itself and then drops a note here, and m2-gm in the
      # game container tells the running server to re-read the list. The panel
      # is kept away from that socket on purpose -- it also accepts SHUTDOWN.
      M2PANEL_GM_SPOOL: "/opt/m2spool"

      # And the language the game speaks. The panel asks; m2-lang in the game
      # container swaps the four files and restarts the cores, because they read
      # them only while they boot. lang.status is how the panel knows which
      # language is live -- including on the download page, where it is the one
      # thing a player cannot find out before downloading a gigabyte.
      M2PANEL_LANG_SPOOL: "/opt/m2spool"

      # Once a day the panel asks the project's repository what the newest
      # published version is, and says so in the admin area when it is behind.
      # This is the ONLY part of this stack that contacts the internet by
      # itself. Set M2_UPDATE_CHECK=0 and it contacts nothing at all; nothing
      # else about the panel changes. The panel's own patch-log page explains
      # this in the operator's language, including what GitHub gets to see.
      M2PANEL_UPDATE_CHECK: "${M2_UPDATE_CHECK:-1}"

      # Whether the panel may offer a button that installs an update. Off, and
      # meant to stay off on anything with a public address: see UPDATING.md.
      # Even set to 1 it does nothing on its own -- the work is done by the
      # `updater' service below, which is in a profile and is not started by
      # `docker compose up -d'.
      M2PANEL_UPDATE_APPLY: "${M2_UPDATE_APPLY:-0}"
      M2PANEL_UPDATE_SPOOL: "/opt/m2update"
      # The one command that updates THIS install, shown on the update page.
      # The installers know it -- they know the URL they were fetched from and
      # the options they were given -- so they write it here and the panel just
      # repeats it. Empty falls back to the by-hand sequence, which is right for
      # a stack somebody assembled themselves. On Windows this is the entire
      # update mechanism: the installer is idempotent, so running it again is
      # the update, and nothing has to sit in the background waiting to do it.
      M2PANEL_UPDATE_COMMAND: "${M2_UPDATE_COMMAND:-}"

      TZ: "${M2_TZ:-UTC}"

    ports:
      # Keep the host address separate from the numeric port.  Older installers
      # encoded "127.0.0.1:7788" in M2_PANEL_PUBLIC_PORT; once the common host
      # bind variable was introduced that produced an invalid two-address
      # mapping such as "0.0.0.0:127.0.0.1:7788:7788".
      # Falling back to M2_HOST_BIND_ADDRESS keeps older local .env files
      # loopback-only until their next installer/update run adds the new key.
      - "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_PANEL_PUBLIC_PORT:-7788}:7788/tcp"

    volumes:
      # m2panel.conf: the admin password hash, per-install salt and Flask
      # session secret. Generated on first run and then never regenerated --
      # losing it logs everyone out and forgets the password.
      - panel-conf:/usr/local/etc
      # client.zip (the game client offered to players) and downloads.db (the
      # per-IP download quota). client.zip is ~1.2 GB and is uploaded by the
      # operator, not shipped in the image.
      - panel-data:/usr/local/m2panel
      # Read-only access to server logs for live bot inspection
      - game-var:/opt/metin2/var:ro
      # The other end of the rate spool. Same volume, same path as in the game
      # container, so a request written here is the file read over there.
      - rates-spool:/opt/m2spool

      # The same arrangement again for updates: the panel leaves a request in
      # here, the updater (below, and only when the operator starts it) reads
      # it and writes back how it is going. A directory, not the Docker socket
      # -- the panel is the internet-facing process in this stack and the
      # socket is root on the host.
      - update-spool:/opt/m2update

    networks: [backend]

  # ---------------------------------------------------------------------------
  # The game client players download.
  #
  # A one-shot tool, not a service. It has a profile, so `docker compose up'
  # never starts it; it is run on purpose:
  #
  #     docker compose run --rm client-builder
  #
  # It fetches the server-file archive (a MEGA share link, over a gigabyte),
  # writes M2_PUBLIC_ADDRESS into the client inside it, and puts the result on
  # the panel's data volume, which is what makes the panel's "Download the game"
  # button work.
  #
  # It is safe to run again. The download and the built client stay in their own
  # cache volume, so changing the address afterwards rewrites one file inside an
  # existing zip and copies it across -- seconds, and nothing is downloaded.
  # ---------------------------------------------------------------------------
  seban-panel:
    build:
      context: ./seban-panel
      dockerfile: Dockerfile
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-seban-panel:3.0.0-test"
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-seban-panel"
    restart: unless-stopped
    depends_on:
      - mariadb
    environment: &seban-env
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: "${M2_DB_USER:-metin2}"
      DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      PLAYERBOTS_GAME_HOST: game
      PLAYERBOTS_ENGINE: mt2009
      PLAYERBOTS_LOGIN_PORT: "11000"
      PLAYERBOTS_WORLD_PORT: "13000"
      PLAYERBOTS_STATUS_GLOB: "/opt/metin2/var/channel*/*/playerbot_status.tsv"
      # Opened by the visitor's browser, so the address the classic panel is
      # reachable at from outside - not a container name.
      # MT2009_PLUS_PANEL_URL_RENAME_V1: M2_SEBAN_PANEL_URL; an install that set the older name keeps it working
      PANEL_URL: "${M2_SEBAN_PANEL_URL:-${M2_SEBAN_TIERU_PANEL_URL:-http://127.0.0.1:${M2_PANEL_PUBLIC_PORT:-7788}}}"
      # Its own secret when .env has one; otherwise the admin-page secret
      # every .env already carries, so no install runs on the upstream default.
      SEBAN_SESSION_SECRET: "${M2_SEBAN_SESSION_SECRET:-${M2_ADMINPAGE_PASSWORD:-change-this-before-public-use}}"
      SEBAN_COLLECTOR_INTERVAL: "${M2_SEBAN_COLLECTOR_INTERVAL:-300}"
      # MT2009_PLUS_PVPFAN_V1: the PVP Fan page shows the game's switch and keeps to its per-war cap (pvpfan.py).
      M2_PVPFAN: "${M2_PVPFAN:-1}"
      M2_PVPFAN_MAX_CATEGORY: "${M2_PVPFAN_MAX_CATEGORY:-500}"
      # MT2009_PLUS_DB_LOG_RETENTION_V1: days of the log database the collector
      # keeps (0 = all). MT2009_PLUS_BOT_LOG_TRIM_V1 (the owner, 6 November
      # 2026): 3 days when the .env has no value; .env.example ships 3 too.
      DB_LOG_RETENTION_DAYS: "${M2_DB_LOG_RETENTION_DAYS:-3}"
      # MT2009_PLUS_SEBAN_SNAPSHOT_RETENTION_V1: how long the collector keeps
      # its own 5-minute snapshots (snapshot_retention.py). Monitoring history,
      # not player data: on by default, also for an .env made before it.
      SEBAN_KEEP_FULL_DAYS: "${M2_SEBAN_KEEP_FULL_DAYS:-2}"
      SEBAN_KEEP_HOURLY_DAYS: "${M2_SEBAN_KEEP_HOURLY_DAYS:-14}"
      SEBAN_KEEP_HISTORY_DAYS: "${M2_SEBAN_KEEP_HISTORY_DAYS:-180}"
      SEBAN_KEEP_NEWS_DAYS: "${M2_SEBAN_KEEP_NEWS_DAYS:-30}"
      SEBAN_GEAR_PER_CHARACTER: "${M2_SEBAN_GEAR_PER_CHARACTER:-300}"
      # MT2009_PLUS_SEBAN_SNAPSHOT_GENTLE_V1: the hours (database time) in
      # which the retention works on a backlog; by day only the small tail.
      SEBAN_SNAPSHOT_HEAVY_HOURS: "${M2_SEBAN_SNAPSHOT_HEAVY_HOURS:-3-6}"
      # Which Playerbots release this world is running. Read from the same
      # VERSION file the launcher writes, so the panel's dashboard reports the
      # server it is actually looking at rather than "nieustawiona".
      # The default is bumped with every release, so a world nobody has
      # configured still reports the version it is actually running.
      PLAYERBOTS_VERSION: "${M2_PLAYERBOTS_VERSION:-2.2.38}"
      # MT2009_PLUS_YOHARA_UPDATER_ON_V1: 0 = no release check and no changelog from GitHub.
      M2_UPDATE_CHECK: "${M2_UPDATE_CHECK:-1}"
      # MT2009_PLUS_LANGUAGE_DEFAULT_V1: the panel's language for a visitor who has not picked one (m2lang cookie).
      M2_DEFAULT_LANGUAGE: "${M2_DEFAULT_LANGUAGE:-pl}"
      # MT2009_PLUS_WEBCLIENT_SERVICE_V1: the "Graj w przeglądarce" link (webclient service).
      M2_WEBCLIENT_ON: "${M2_WEBCLIENT_ON:-1}"
      M2_WEBCLIENT_PORT: "${M2_WEBCLIENT_PORT:-7792}"
      M2_WEBCLIENT_PUBLIC_URL: "${M2_WEBCLIENT_PUBLIC_URL:-}"
      M2_WEBCLIENT_ADDRESS: "${M2_PUBLIC_ADDRESS:-}"
      TZ: "${M2_TZ:-UTC}"
    ports:
      # 7790 outside: 7789 is the browser bridge's port in this stack.
      - "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_SEBAN_PANEL_PORT:-7790}:7789/tcp"
    volumes:
      - game-var:/opt/metin2/var:ro
      - rates-spool:/opt/m2spool
      # The updater's spool, the same one the classic panel and the updater
      # service share: 1.38 of this panel carries an update button that
      # writes a request there and reads the updater's status back. Without
      # the mount the button can only say "the updater is not running".
      - update-spool:/opt/m2update
    networks: [backend]

  # The ItemShop (OskarPWA): a PHP shop for Dragon Coins (account.cash) and
  # Dragon Marks (account.cash_mark since MT2009_PLUS_SZ_UNIFIED_V1, as in
  # the game; mileage before), opened from the coin on the game's
  # taskbar in the client's built-in browser. A purchase writes
  # player.item_award; the db core delivers it at the player's next login.
  # Its own tables live in the itemshop database, created and seeded by
  # playerbot-migrate (mariadb/playerbot/itemshop_schema.sql).
  itemshop:
    build:
      context: ./itemshop
      dockerfile: Dockerfile
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-itemshop:3.0.0-test"
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-itemshop"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      M2_DB_HOST: mariadb
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      # The r40250 core signs the shop link with "GF9001"; only a core built
      # with another key needs this changed.
      M2_MALL_SAS_KEY: "${M2_MALL_SAS_KEY:-GF9001}"
      # MT2009_PLUS_SHOP3_TOKEN_V1: the game's ItemShop link carries a fresh HMAC token (120 s, single use) of the
      # account in game - the key as the game service has it. The old static md5 link alone (sas, valid for ever)
      # is refused unless M2_SHOP3_LEGACY_SAS=1 (only for a game core built without the token).
      M2_SHOP3_TOKEN_SECRET: "${M2_SHOP3_TOKEN_SECRET:-}"
      M2_SHOP3_LEGACY_SAS: "${M2_SHOP3_LEGACY_SAS:-0}"
      # MT2009_PLUS_LANGUAGE_DEFAULT_V1: the shop's language for a visitor who has not picked one (m2lang cookie, the
      # character's own game language).
      M2_DEFAULT_LANGUAGE: "${M2_DEFAULT_LANGUAGE:-pl}"
      TZ: "${M2_TZ:-UTC}"
    ports:
      # MT2009_PLUS_ITEMSHOP_PUBLIC_V1: the ItemShop is the players' page (the in-game coin opens it on the
      # address M2_MALL_URL gives the client), so it follows the game's ports (M2_HOST_BIND_ADDRESS), not the
      # admin panels' 127.0.0.1 of a VPS install - there the players' clients could not reach it at all
      # ("Nawigacja do strony sieci Web zostala anulowana"). It has no admin page.
      - "${M2_ITEMSHOP_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_ITEMSHOP_PUBLIC_PORT:-7791}:80/tcp"
    networks: [backend]

  # MT2009_PLUS_WEBCLIENT_SERVICE_V1: the game in a web browser (computer and phone),
  # on its own port like the panels: http://<M2_PUBLIC_ADDRESS>:<M2_WEBCLIENT_PORT>/
  # (http://127.0.0.1:7792/ on a local install). One container: nginx serving the
  # page, the WebSocket -> TCP bridge to the game container (/to/), and the
  # download of the site (~2 GB, once; a client patch brings only its new files)
  # into the webclient-site volume.
  #
  #   * the bridge reaches exactly this stack's login and game cores - the ones the
  #     page's server list names, mapped onto M2_GAME_PORT_BASE /
  #     M2_GAME_CONTAINER_PORT_RANGE - and nothing else; pages of other sites are
  #     refused (allowed: this address and port, M2_WEBCLIENT_PUBLIC_URL,
  #     M2_WEBCLIENT_ORIGINS);
  #   * the site is the release webclient/site-release.json pins (every server
  #     update carries the pin of its client patch, so `up -d --build` after an
  #     update brings the matching web client), downloaded from
  #     M2_WEBCLIENT_SOURCE and checked file by file against the pinned SHA-256
  #     index; M2_WEBCLIENT_SOURCE_DIR serves the same from a folder (offline);
  #   * players' page like the ItemShop: published with the game's ports
  #     (M2_HOST_BIND_ADDRESS), not on the panels' 127.0.0.1 of a VPS install;
  #   * M2_WEBCLIENT_ON=0: the container idles, nothing is downloaded or served.
  # The web client kit is GPL-2.0 (nairoad) - webclient/NOTICE.md.
  webclient:
    build:
      context: ./webclient
      dockerfile: Dockerfile
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-webclient:3.0.0-test"
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-webclient"
    restart: unless-stopped
    init: true
    depends_on:
      - game
    environment:
      M2_WEBCLIENT_ON: "${M2_WEBCLIENT_ON:-1}"
      M2_DEFAULT_LANGUAGE: "${M2_DEFAULT_LANGUAGE:-pl}"
      M2_WEBCLIENT_PORT: "${M2_WEBCLIENT_PORT:-7792}"
      M2_WEBCLIENT_ORIGINS: "${M2_WEBCLIENT_ORIGINS:-}"
      M2_WEBCLIENT_PUBLIC_URL: "${M2_WEBCLIENT_PUBLIC_URL:-}"
      M2_WEBCLIENT_SOURCE: "${M2_WEBCLIENT_SOURCE:-http://141.94.100.53/aktualizacje/webklient-yohara/}"
      M2_PUBLIC_ADDRESS: "${M2_PUBLIC_ADDRESS:-}"
      M2_GAME_CONTAINER_PORT_RANGE: "${M2_GAME_CONTAINER_PORT_RANGE:-13000-13003}"
      M2_GAME_PORT_BASE: "${M2_GAME_PORT_BASE:-13000}"
      TZ: "${M2_TZ:-UTC}"
    ports:
      - "${M2_WEBCLIENT_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_WEBCLIENT_PORT:-7792}:8080/tcp"
    volumes:
      - webclient-site:/site
      - "${M2_WEBCLIENT_SOURCE_DIR:-./webclient/no-local-source}:/websrc:ro"
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    networks: [backend]

  # The panel's two helpers run the image the seban-panel service builds.
  # An older Compose does not know that and tries to pull it from Docker
  # Hub first - "pull access denied for metin2/seban-panel" - which ended
  # a start with no such image yet in code 1 (DUDU on a VPS, archonek
  # updating on Windows, 18 September; Compose 5.5 here never pulls it).
  # Never pulled: the build in the same `up` makes it before they start.
  seban-collector:
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-seban-panel:3.0.0-test"
    pull_policy: never
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-seban-collector"
    restart: unless-stopped
    command: ["python", "collector.py"]
    depends_on:
      - seban-panel
    environment: *seban-env
    volumes:
      # The host's load, or on Docker Desktop the VM's - what there is.
      - /proc:/host/proc:ro
      - /:/hostfs:ro
      - game-var:/opt/metin2/var:ro
    networks: [backend]

  seban-item-grants:
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-seban-panel:3.0.0-test"
    pull_policy: never
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-seban-item-grants"
    restart: unless-stopped
    command: ["python", "item_grants.py"]
    depends_on:
      - seban-panel
    environment: *seban-env
    networks: [backend]

  updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    image: "${M2_CONTAINER_PREFIX:-m2yohara-test}-updater:3.0.0-test"
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-updater"
    profiles: ["update"]
    restart: unless-stopped
    init: true
    # The 2.x line updates from the package zip the manifest names - the same
    # zip the Windows launcher installs - and not from a git checkout of the
    # repository: the repository's root VERSION is the 1.x line's, and the 1.x
    # updater staged that line over a 2.x server ("checkout z main melduje
    # 1.33.3", rates stuck, no stalls - l0st3k, 12 September).
    # linux-port/tools/update.sh in watch mode reads the request the panel
    # writes and answers in the same update.status the panel reads.
    entrypoint: ["/bin/sh", "${M2_UPDATE_STACK_DIR:-/opt/metin2}/linux-port/tools/update.sh"]
    command: ["watch"]

    environment:
      M2_UPDATE_SPOOL: "/opt/m2update"
      # Where the installed stack is -- the directory holding this file.
      # On this line the "stack dir" is the server folder itself: the one
      # with VERSION, CHANGELOG.md and linux-port/ in it.
      M2_UPDATE_STACK_DIR: "${M2_UPDATE_STACK_DIR:-/opt/metin2}"
      # Where install.sh put the source cache and the git checkout inside it.
      M2_UPDATE_CACHE_DIR: "${M2_UPDATE_CACHE_DIR:-/var/cache/m2src}"
      M2_UPDATE_REPO_DIR: "${M2_UPDATE_REPO_DIR:-/var/cache/m2src/repo}"
      M2_UPDATE_BRANCH: "${M2_UPDATE_BRANCH:-main}"
      # 0: answer the advanced panel's .env editor (env.request) only and
      # never install an update (MT2009_PLUS_ENV_EDITOR_V1). Unset, it follows
      # M2_UPDATE_APPLY - the panel's "update" button - so an updater that
      # update.sh / the launcher start by themselves (MT2009_PLUS_UPDATER_AUTOSTART_V1)
      # installs nothing unless the owner switched that button on.
      M2_UPDATE_WATCH_UPDATES: "${M2_UPDATE_WATCH_UPDATES:-${M2_UPDATE_APPLY:-0}}"
      TZ: "${M2_TZ:-UTC}"

    volumes:
      # The request/response directory shared with the panel. This is the whole
      # of the interface between them: the panel can leave a file here and can
      # read what this writes back. It cannot reach anything else in here.
      - update-spool:/opt/m2update

      # The host's Docker daemon. This is the dangerous mount in this file, and
      # it is confined to this service on purpose. Read UPDATING.md.
      - /var/run/docker.sock:/var/run/docker.sock

      # Same path inside as outside -- see above.
      - "${M2_UPDATE_STACK_DIR:-/opt/metin2}:${M2_UPDATE_STACK_DIR:-/opt/metin2}"
      - "${M2_UPDATE_CACHE_DIR:-/var/cache/m2src}:${M2_UPDATE_CACHE_DIR:-/var/cache/m2src}"

    # Not on `backend': it has no business talking to the database or the game,
    # and the only network it needs is the one out to the project's repository.
    # Compose gives it the default network, which is created only when this
    # service is actually started.

# =============================================================================

  # ==== end of the shared services ====

volumes:
  db-data:
  webclient-site:
  update-spool:
  panel-data:
  panel-conf:
  game-var:
  rates-spool:

networks:
  backend:
    driver: bridge
